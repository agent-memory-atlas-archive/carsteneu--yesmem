# Provenance of the bundled caps. internal/setup decides from this file whether a
# bundled body may replace the installed one; the frontmatter version stays in the
# CAP.md but no longer gates anything (YM-450).
#
# derived_from_hash is the body this bundle was derived from, that is the CAP.md an
# installation holds. The digest is textutil.BodyDigest: it ignores line endings and
# trailing newlines and compares everything else, because inside a cap body the case
# and the indentation are the program. A body that was only checked out with CRLF, or
# whose trailing newlines differ, therefore compares equal to the body it descends
# from.
#
# An entry that carries the hash of its own body makes no claim: it only says that
# an installation holding exactly these bytes already has the bundle. Editing a body
# normally needs no edit here, because the entry already names the body the new one
# descends from, and that is the body an installation took last. It changes only
# after a reported conflict was reconciled; the conflict line names the hash to
# record.
#
# revision counts the installs that reached an installation. The live count is kept
# in <caps_dir>/manifest.yaml; the value here records what this file is.
